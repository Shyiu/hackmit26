[project]
name = "vision-service"
version = "0.1.0"
description = "Single-frame vision safety pipeline for memory glasses"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pymongo>=4.8",
  "cryptography>=43",
  "numpy>=1.26",
  "Pillow>=10",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mongomock>=4.3", "httpx>=0.27"]
dfine = ["torch", "transformers>=4.52"]
yoloe = ["ultralytics"]
faces = ["insightface", "onnxruntime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_service"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
