# Local MongoDB for development and tests: `pnpm db:up`, then
# MONGODB_URI=mongodb://localhost:27017/?directConnection=true
#
# The atlas-local image runs MongoDB 8.0, the same version as the Atlas free
# tier, plus Atlas Search, so `pnpm db:setup --search` works locally too.
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    # The replica set config in the volume names this host, so without a fixed
    # one a recreated container isn't a member of its own set and won't start.
    hostname: mongo
    # mongod inherits Docker's 1024 soft file limit on some hosts, and the test
    # suite's connections and index builds take it past that, where mongod
    # aborts with TooManyFilesOpen instead of refusing one connection.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

volumes:
  mongo-data:
  mongo-config:
